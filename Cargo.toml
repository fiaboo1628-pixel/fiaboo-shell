[package]
name = "fiaboo-shell"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.14" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", features = ["font-kit", "wayland", "runtime_shaders"] }

serde_json = "1"
futures = "0.3"
zbus = "5"
png = "0.17"

# no panic = "abort": a panicking background thread must die alone, not take the desktop with it
[profile.release]
strip = true
lto = "thin"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
