# hyprlock for fiaboo-shell. Images come from fiaboo-wallpaper (~/.cache/fiaboo-shell/wallpaper),
# colours are Catppuccin Mocha (the shell's fallback palette). Installed as ~/.config/hypr/hyprlock.conf.

general {
    hide_cursor = true
}

background {
    path = ~/.cache/fiaboo-shell/wallpaper/blurred.png
    color = rgb(1e1e2e)
}

label {
    text = cmd[update:1000] date +%H:%M
    font_family = JetBrainsMono Nerd Font
    font_size = 96
    color = rgb(cdd6f4)
    position = 0, 160
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date '+%A, %d %B'
    font_family = JetBrainsMono Nerd Font
    font_size = 16
    color = rgb(bac2de)
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    size = 320, 48
    rounding = 12
    outline_thickness = 1
    outer_color = rgba(cdd6f490)
    inner_color = rgba(1e1e2ecc)
    font_color = rgb(cdd6f4)
    check_color = rgb(89b4fa)
    fail_color = rgb(f38ba8)
    font_family = JetBrainsMono Nerd Font
    placeholder_text = Password
    fail_text = Wrong password
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
